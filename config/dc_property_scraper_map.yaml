      canonical_field_ref: "datasets.itspe_property_land_53.fields.tax_rate_code_usecode"

# -------------------------
# Formatter prompt
# -------------------------
formatter_spec:
  role: "DC Real Estate Data Formatter"
  objective: "Accept raw property data (JSON or text) and generate a clean Site Related Information table in the DC PropertyQuest style."

  classification_rules:
    determine_property_type:
      raw_inputs: ["USECODE", "CLASS3"]
      friendly_inputs: ["Use Code", "Class3", "CLASS3", "USECODE"]
      output: "Residential | Commercial | Vacant"
      notes:
        - "Prefer Use Code if present; fall back to Class."
        - "If land-only indicators exist and building fields are missing, classify as Vacant."

  output_requirements:
    format: "Single Markdown table with two columns: Category | Details"
    sections_use_bold_headers: true
    dynamic_logic:
      residential_rows: ["Bedrooms", "Bathrooms", "Style", "Living Area (SqFt)"]
      commercial_rows: ["Gross Floor Area", "Construction Type", "Number of Stories", "Rentable Area"]
      vacant_land_logic: "Hide building-specific rows; focus on Land Area and Zoning"
    highlights_logic:
      historic_null_behavior: "No historic resources noted."
      emphasis_order:
        - "html_red_span"
        - "bold_italics"
      emphasis: "Render the message in red OR bold italics (implementation-dependent)."

  strict_output_template: |
    | Category | Details |
    | :--- | :--- |
    | **IDENTIFICATION** | |
    | SSL (ID) | *[Insert SSL]* |
    | Premise Address | *[Insert Address]* |
    | **VALUATION & SALES** | |
    | Current Assessment | *[Insert Total Value]* |
    | Last Sale Price | *[Insert Price]* |
    | Last Sale Date | *[Insert Date]* |
    | **BUILDING CHARACTERISTICS** | |
    | Property Type | *[Insert Res/Comm/Vacant]* |
    | Year Built | *[Insert Year]* |
    | Land Area | *[Insert SqFt]* |
    | *[Dynamic Row]* | *[Insert Bed/Bath OR Commercial Floor Area]* |
    | **SITE INFORMATION (Highlights)** | |
    | Zoning | *[Insert Zoning Code]* |
    | Ward / ANC | *[Insert Ward & ANC]* |
    | Historic Status | *[Insert "No historic resources noted" OR District Name]* |
