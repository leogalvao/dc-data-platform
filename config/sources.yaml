  source_type: web_scrape
  enabled: true

  base_url: "https://crossingdc.com/"
  requires_auth: false

  # Be gentle with the website
  requests_per_second: 0.5
  max_workers: 1
  batch_size: 100
  timeout_seconds: 30

  adapter_class: "src.adapters.real_estate.crossing.CrossingAdapter"
  output_record_types: [RentalRecord]

  extra:
    sightmap_api_base: "https://sightmap.com/app/api/v1/sightmaps"
    property_name: "Crossing DC"
    city: "Washington"
    state: "DC"


realtor_api:
  display_name: "Realtor.com (RapidAPI)"
  description: "Real estate listings via RapidAPI"
  source_type: rest_api
  enabled: false  # Requires API key

  base_url: "https://realtor-com-real-estate.p.rapidapi.com"
  requires_auth: true
  api_key_env: "RAPIDAPI_KEY"

  requests_per_second: 1.0
  max_workers: 1
  batch_size: 100

  adapter_class: "src.adapters.real_estate.crossing.RealtorAdapter"
  output_record_types: [PropertyRecord]

  extra:
    search_areas:
      - city: Washington
        state: DC
      - city: Arlington
        state: VA


rentcast_api:
  display_name: "RentCast API"
  description: "Rental market statistics and estimates"
