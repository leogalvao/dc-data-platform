# Universal Scraper Framework - Source Configuration
# Each source defines connection settings, rate limits, and adapter info

# =============================================================================
# DC Government Data Sources (ArcGIS REST API)
# =============================================================================

dc_contracts:
  display_name: "DC Government Contracts"
  description: "District of Columbia government contracts from DCGIS"
  source_type: rest_api
  enabled: true

  # Connection
  base_url: "https://maps2.dcgis.dc.gov/dcgis/rest/services/DCGIS_DATA/Government_Operations/MapServer"
  requires_auth: false

  # Rate limiting
  requests_per_second: 2.0
  rate_limit_wait_seconds: 30
  max_retries: 3
  retry_backoff_factor: 2.0

  # Concurrency
  max_workers: 5
  batch_size: 1000
  timeout_seconds: 60

  # Adapter
  adapter_class: "src.adapters.dc_arcgis.contracts.ContractsAdapter"
  output_record_types:
    - ContractRecord

  # Storage partitioning
  bronze_partition_by: [source, date]
  silver_partition_by: [category, date]

  # Source-specific settings
  extra:
    mapserver_id: 37


dc_purchase_orders:
  display_name: "DC Purchase Orders"
  description: "District of Columbia government purchase orders"
  source_type: rest_api
  enabled: true
  base_url: "https://maps2.dcgis.dc.gov/dcgis/rest/services/DCGIS_DATA/Government_Operations/MapServer"
  requires_auth: false
  requests_per_second: 2.0
  max_workers: 5
  batch_size: 1000
  timeout_seconds: 60
  adapter_class: "src.adapters.dc_arcgis.contracts.PurchaseOrdersAdapter"
  output_record_types: [PurchaseOrderRecord]
  extra:
    mapserver_id: 16


dc_payments:
  display_name: "DC Payments"
  description: "District of Columbia government payments"
  source_type: rest_api
  enabled: true
  base_url: "https://maps2.dcgis.dc.gov/dcgis/rest/services/DCGIS_DATA/Government_Operations/MapServer"
  requires_auth: false
  requests_per_second: 2.0
  max_workers: 5
  batch_size: 1000
  adapter_class: "src.adapters.dc_arcgis.contracts.PaymentsAdapter"
  output_record_types: [PaymentRecord]
  extra:
    mapserver_id: 17


dc_opendata:
  display_name: "DC Open Data"
  description: "Multiple DC datasets (CBE, CAMA, Business Licenses)"
  source_type: rest_api
  enabled: true
  base_url: "https://maps2.dcgis.dc.gov/dcgis/rest/services"
  requires_auth: false
  requests_per_second: 1.0
  max_workers: 3
  batch_size: 1000
  adapter_class: "src.adapters.dc_arcgis.contracts.DCOpenDataAdapter"
