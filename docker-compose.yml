services:
  factory:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.factory
    container_name: factory-pipeline
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
    networks:
      - factory-network
    command: ["python", "scripts/factory_refresh.py", "--incremental"]

  dashboard:
    image: nginx:alpine
    container_name: factory-dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./deploy/nginx/dashboard.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - factory-network

  warehouse_db:
    image: postgres:15-alpine
    container_name: factory-warehouse
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-procurement_warehouse}
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-warehouse_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-change_me}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    networks:
      - factory-network

  redis:
    image: redis:7-alpine
    container_name: factory-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - factory-network

networks:
  factory-network:
    driver: bridge

volumes:
  warehouse_data:
  redis_data:
