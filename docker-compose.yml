services:
  # PostgreSQL Database for Analytics Warehouse
  warehouse_db:
    image: postgres:15-alpine
    container_name: dc-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DC_WAREHOUSE_DB_NAME:-dc_analytics}
      POSTGRES_USER: ${DC_WAREHOUSE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DC_WAREHOUSE_DB_PASSWORD:-changeme}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dc_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dc-network

  # Redis Cache (for rate limiting and caching)
  redis:
    image: redis:7-alpine
    container_name: dc-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dc-network

  # DC Data Platform - Pipeline Runner
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dc-pipeline
    depends_on:
      warehouse_db:
        condition: service_healthy
    environment:
      DC_ENVIRONMENT: ${DC_ENVIRONMENT:-prod}
      DC_WAREHOUSE_DB_HOST: warehouse_db
      DC_WAREHOUSE_DB_PORT: 5432
      DC_WAREHOUSE_DB_NAME: ${DC_WAREHOUSE_DB_NAME:-dc_analytics}
      DC_WAREHOUSE_DB_USER: ${DC_WAREHOUSE_DB_USER:-postgres}
      DC_WAREHOUSE_DB_PASSWORD: ${DC_WAREHOUSE_DB_PASSWORD:-changeme}
      DC_LOG_LEVEL: ${DC_LOG_LEVEL:-INFO}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
    volumes:
      - ./data:/app/data
    networks:
      - dc-network
    # Run pipeline once then exit (use with docker-compose run)
    command: ["python", "scripts/unified_pipeline.py"]

  # FastAPI Dashboard API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dc-api
    depends_on:
      warehouse_db:
        condition: service_healthy
    environment:
      DC_ENVIRONMENT: ${DC_ENVIRONMENT:-prod}
      DC_WAREHOUSE_DB_HOST: warehouse_db
      DC_WAREHOUSE_DB_PORT: 5432
      DC_WAREHOUSE_DB_NAME: ${DC_WAREHOUSE_DB_NAME:-dc_analytics}
      DC_WAREHOUSE_DB_USER: ${DC_WAREHOUSE_DB_USER:-postgres}
      DC_WAREHOUSE_DB_PASSWORD: ${DC_WAREHOUSE_DB_PASSWORD:-changeme}
    ports:
      - "8000:8000"
    networks:
      - dc-network
    command: ["python", "-m", "uvicorn", "warehouse.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # Scheduled Pipeline Runner (runs daily at 2 AM UTC)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dc-scheduler
    depends_on:
      warehouse_db:
        condition: service_healthy
    environment:
      DC_ENVIRONMENT: ${DC_ENVIRONMENT:-prod}
      DC_WAREHOUSE_DB_HOST: warehouse_db
      DC_WAREHOUSE_DB_PORT: 5432
      DC_WAREHOUSE_DB_NAME: ${DC_WAREHOUSE_DB_NAME:-dc_analytics}
      DC_WAREHOUSE_DB_USER: ${DC_WAREHOUSE_DB_USER:-postgres}
      DC_WAREHOUSE_DB_PASSWORD: ${DC_WAREHOUSE_DB_PASSWORD:-changeme}
      DC_LOG_LEVEL: ${DC_LOG_LEVEL:-INFO}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 2 * * *}
    volumes:
      - ./data:/app/data
    networks:
      - dc-network
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Pipeline scheduler started. Running on schedule: $${SCHEDULE_CRON}"
        apt-get update && apt-get install -y cron
        echo "$${SCHEDULE_CRON} cd /app && python scripts/unified_pipeline.py --incremental >> /app/data/pipeline.log 2>&1" > /etc/cron.d/pipeline
        chmod 0644 /etc/cron.d/pipeline
        crontab /etc/cron.d/pipeline
        cron -f
    restart: unless-stopped
    profiles:
      - scheduled

networks:
  dc-network:
    driver: bridge

volumes:
  warehouse_data:
  redis_data:
