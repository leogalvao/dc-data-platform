# Spend by Vendor Gold Layer Data Contract
name: spend_by_vendor
version: "1.0"
description: Aggregated spending by vendor with contract and payment metrics
owner: data-engineering
layer: gold

primary_key:
  - vendor_id

tags:
  - procurement
  - spending
  - analytics
  - kpi

sla:
  freshness_hours: 24
  min_row_count: 100
  max_null_rate: 0.1
  max_duplicate_rate: 0.0

columns:
  vendor_id:
    type: string
    nullable: false
    description: Unique vendor identifier
    primary_key: true

  vendor_name:
    type: string
    nullable: false
    description: Vendor name (normalized)
    max_null_rate: 0.0

  total_spend:
    type: decimal
    nullable: false
    description: Total spending amount across all contracts
    min_value: 0

  contract_count:
    type: integer
    nullable: false
    description: Number of contracts with this vendor
    min_value: 0

  payment_count:
    type: integer
    nullable: false
    description: Number of payments to this vendor
    min_value: 0

  avg_contract_value:
    type: decimal
    nullable: true
    description: Average contract value

  first_contract_date:
    type: date
    nullable: true
    description: Date of first contract

  last_payment_date:
    type: date
    nullable: true
    description: Date of most recent payment

  is_cbe:
    type: boolean
    nullable: true
    description: Whether vendor is CBE certified

  cbe_type:
    type: string
    nullable: true
    description: CBE certification type if applicable

  primary_agency:
    type: string
    nullable: true
    description: Agency with most spending to this vendor

  top_category:
    type: string
    nullable: true
    description: Most common spending category

  updated_at:
    type: timestamp
    nullable: false
    description: Timestamp of last update
